services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dynamic_form_lottery
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dynamic-form-network
  backend:
   image: dynamic-form-lottery-backend
   container_name: dynamic-form-lottery-backend
   depends_on: 
     - postgres
   ports:
     - "8080:8080"
   environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/dynamic_form_lottery
      DB_USERNAME: app_user
      DB_PASSWORD: password
      JWT_SECRET: 9f4c8e7a2d1b5c6e8f901234567890abcdefABCDEF
      BOOTSTRAP_ADMIN_ENABLED: true
      BOOTSTRAP_ADMIN_EMAIL: admin@local.dev
      BOOTSTRAP_ADMIN_DISPLAY_NAME: Local Admin
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe123!
   networks:
      - dynamic-form-network
    
volumes:
  postgres-data:

networks:
  dynamic-form-network:
